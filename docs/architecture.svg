<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b4b">Agent Output Validator — Pipeline Architecture</text>

  <!-- Input -->
  <rect x="30" y="70" width="160" height="70" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5">AGENT OUTPUT</text>
  <text x="110" y="115" text-anchor="middle" font-size="10" fill="#64748b">Raw text from any</text>
  <text x="110" y="128" text-anchor="middle" font-size="10" fill="#64748b">upstream AI agent</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="105" x2="230" y2="105" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent 1: Fact Extractor -->
  <rect x="235" y="60" width="145" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="235" y="60" width="145" height="28" rx="10" fill="url(#headerGrad)"/>
  <rect x="235" y="78" width="145" height="10" fill="url(#headerGrad)"/>
  <text x="307" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">1. Fact Extractor</text>
  <text x="307" y="105" text-anchor="middle" font-size="9" fill="#4338ca">Claims as structured</text>
  <text x="307" y="117" text-anchor="middle" font-size="9" fill="#4338ca">JSON (numbers, dates,</text>
  <text x="307" y="129" text-anchor="middle" font-size="9" fill="#4338ca">tickers, percentages)</text>
  <text x="307" y="145" text-anchor="middle" font-size="8" fill="#818cf8">LLM: Claude Sonnet</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="105" x2="420" y2="105" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent 2: Citation Verifier -->
  <rect x="425" y="60" width="145" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="425" y="60" width="145" height="28" rx="10" fill="url(#headerGrad)"/>
  <rect x="425" y="78" width="145" height="10" fill="url(#headerGrad)"/>
  <text x="497" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">2. Citation Verifier</text>
  <text x="497" y="105" text-anchor="middle" font-size="9" fill="#4338ca">FAISS top-3 retrieval</text>
  <text x="497" y="117" text-anchor="middle" font-size="9" fill="#4338ca">supported / contradicted</text>
  <text x="497" y="129" text-anchor="middle" font-size="9" fill="#4338ca">/ unsupported verdict</text>
  <text x="497" y="145" text-anchor="middle" font-size="8" fill="#818cf8">LLM + FAISS IndexFlatIP</text>

  <!-- Arrow 3 -->
  <line x1="570" y1="105" x2="610" y2="105" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent 3: Hallucination Scorer -->
  <rect x="615" y="60" width="145" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="615" y="60" width="145" height="28" rx="10" fill="url(#headerGrad)"/>
  <rect x="615" y="78" width="145" height="10" fill="url(#headerGrad)"/>
  <text x="687" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">3. Hallucin. Scorer</text>
  <text x="687" y="105" text-anchor="middle" font-size="9" fill="#4338ca">6-category failure</text>
  <text x="687" y="117" text-anchor="middle" font-size="9" fill="#4338ca">taxonomy classification</text>
  <text x="687" y="129" text-anchor="middle" font-size="9" fill="#4338ca">per non-supported claim</text>
  <text x="687" y="145" text-anchor="middle" font-size="8" fill="#818cf8">LLM: Claude Sonnet</text>

  <!-- Arrow 4 (going down) -->
  <line x1="687" y1="150" x2="687" y2="190" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent 4: Escalation Router -->
  <rect x="560" y="195" width="200" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="560" y="195" width="200" height="28" rx="10" fill="#f59e0b"/>
  <rect x="560" y="213" width="200" height="10" fill="#f59e0b"/>
  <text x="660" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">4. Escalation Router</text>
  <text x="660" y="240" text-anchor="middle" font-size="9" fill="#92400e">Pure Python (no LLM)</text>
  <text x="660" y="252" text-anchor="middle" font-size="9" fill="#92400e">Avg confidence + contradiction</text>
  <text x="660" y="264" text-anchor="middle" font-size="9" fill="#92400e">ratio → deterministic routing</text>

  <!-- Three output arrows -->
  <!-- PASS -->
  <line x1="590" y1="285" x2="520" y2="340" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="345" width="120" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">PASS</text>
  <text x="500" y="383" text-anchor="middle" font-size="9" fill="#166534">conf ≥ 0.8, no contradictions</text>

  <!-- FLAG -->
  <line x1="660" y1="285" x2="660" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="345" width="120" height="50" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#a16207">FLAG</text>
  <text x="660" y="383" text-anchor="middle" font-size="9" fill="#854d0e">needs human review</text>

  <!-- BLOCK -->
  <line x1="730" y1="285" x2="800" y2="340" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="345" width="120" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="800" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">BLOCK</text>
  <text x="800" y="383" text-anchor="middle" font-size="9" fill="#991b1b">conf &lt; 0.5 or ≥50% wrong</text>

  <!-- Corpus box -->
  <rect x="30" y="190" width="180" height="130" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Validation Corpus</text>
  <text x="120" y="235" text-anchor="middle" font-size="9" fill="#15803d">NVIDIA 10-K FY2026</text>
  <text x="120" y="248" text-anchor="middle" font-size="9" fill="#15803d">Microsoft 10-K FY2026</text>
  <text x="120" y="261" text-anchor="middle" font-size="9" fill="#15803d">Apple 10-K FY2025</text>
  <text x="120" y="274" text-anchor="middle" font-size="9" fill="#15803d">Fed Monetary Policy</text>
  <text x="120" y="287" text-anchor="middle" font-size="9" fill="#15803d">SEC Rule 206(4)-1</text>
  <text x="120" y="305" text-anchor="middle" font-size="8" fill="#4ade80">FAISS IndexFlatIP</text>
  <text x="120" y="315" text-anchor="middle" font-size="8" fill="#4ade80">text-embedding-3-small</text>

  <!-- Dashed line from corpus to Citation Verifier -->
  <line x1="210" y1="240" x2="497" y2="150" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Tech stack footer -->
  <rect x="30" y="430" width="840" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">LangGraph StateGraph  ·  FAISS  ·  OpenAI Embeddings  ·  Claude Sonnet  ·  Pydantic v2  ·  FastAPI  ·  Streamlit</text>
  <text x="450" y="472" text-anchor="middle" font-size="9" fill="#94a3b8">16 labeled test samples  ·  5 real SEC filing sources  ·  6-category failure taxonomy  ·  precision/recall/F1 evaluation harness</text>
  <text x="450" y="490" text-anchor="middle" font-size="9" fill="#94a3b8">17 unit tests  ·  Docker Compose deployment  ·  Batch validation API</text>
</svg>
