[project]
name = "agent-output-validator"
version = "0.1.0"
description = "Multi-agent swarm that validates AI agent outputs for hallucinations, unsupported claims, and confidence scoring"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
